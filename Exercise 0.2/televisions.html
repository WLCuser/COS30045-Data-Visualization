<html>
    <head>
        <meta charset="UTF-8">
        <title>Appliance Energy Consumption Website</title>
        <link rel="stylesheet" href="assets/css/styles.css">
    </head>
    <body>
        <nav>
            <a href="index.html"><img src="assets/img/PowerIcon.png"></a>
            <div class="menu-items">
                <a href="index.html">Homepage</a>
                <a href="televisions.html" class="active">Televisions</a>
                <a href="about.html">About Us</a>
            </div>
        </nav>

        <div class="calculator">
            <h2>Energy Cost Calculator</h2>

            <label for="wattage">Appliance power usage (watts):</label>
            <input type="number" id="wattage" placeholder="e.g. 1200">
            <span class="error-message" id="wattage-error"></span>

            <label for="hours">Average hours of use per day:</label>
            <input type="number" id="hours" placeholder="e.g. 3">
            <span class="error-message" id="hours-error"></span>

            <label for="price">Electricity price (cents per kWh):</label>
            <input type="number" id="price" placeholder="e.g. 30">
            <span class="error-message" id="price-error"></span>

            <button id="calculate-btn">Calculate</button>

            <div id="result"></div>
        </div>

        <script src="assets/js/scripts.js"></script>

        <footer>
            <p>Year created: 2026 | Created by: Wong Li Cheng | GenAI used: claude.ai</p>
        </footer>
    </body>
</html>
